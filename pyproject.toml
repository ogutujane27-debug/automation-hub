[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-hub"
version = "0.1.0"
description = "Central platform for registering, executing and monitoring business automations."
requires-python = ">=3.11"

[project.scripts]
automation-platform = "automation_platform.cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
